
name: Build Flutter APK

on:
  push:
    branches: [ feat-add-github-action-for-apk-build-14428721716606341254 ]
  pull_request:
    branches: [ feat-add-github-action-for-apk-build-14428721716606341254 ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # سحب ملفات المشروع
    - name: Checkout repository
      uses: actions/checkout@v3

    # تثبيت Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.10.0' # عدّل إذا تحتاج إصدار آخر

    # تثبيت الاعتمادات
    - name: Install dependencies
      run: flutter pub get

    # بناء APK Debug
    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk

    # (اختياري) بناء APK Release موقع إذا وفرت Keystore
    - name: Decode Keystore
      if: secrets.KEYSTORE_BASE64 != ''
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

    - name: Build Release APK
      if: secrets.KEYSTORE_BASE64 != ''
      run: |
        flutter build apk --release \
          --no-tree-shake-icons
      env:
        JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF8"

    - name: Upload Release APK
      if: secrets.KEYSTORE_BASE64 != ''
      uses: actions/upload-artifact@v3
      with:
        name: app-release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
