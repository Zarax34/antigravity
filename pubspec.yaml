name: quran_center_app
description: نظام شامل لإدارة مراكز وحلقات تحفيظ القرآن الكريم
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9
  
  # Database & Storage
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  drift_flutter: ^0.1.0
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Networking
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  
  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.1.0
  
  # Forms & Validation
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.0.0
  
  # File Handling
  excel: ^4.0.3
  file_picker: ^8.1.3
  image_picker: ^1.0.7
  permission_handler: ^11.1.0
  
  # Utilities
  uuid: ^4.2.2
  equatable: ^2.0.5
  dartz: ^0.10.1
  get_it: ^7.6.4
  injectable: ^2.3.2
  
  # Navigation
  go_router: ^13.0.1
  
  # Local Notifications
  flutter_local_notifications: ^17.2.4
  
  cupertino_icons: ^1.0.6
  
  # Biometric Authentication
  local_auth: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.14.1
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/translations/
